# 光学领域质检规则包（机器视觉/光电类课程）
# applies_when: 可选关键词门——断言/提示词/帧要素命中任一关键词才进考卷（规则动态装载，治判官分心）；
#   不写该字段 = 永远装载。OPT-06 光影一致性适用于所有画面，故不加门。
rules:
  - id: OPT-01
    applies_when: [光束, 光路, 光线, 激光, 平行光, 透镜, 会聚, 反射, 折射, 条纹, beam, ray, laser, lens, optical path, reflection, refraction, fringe]
    name: 平行光束平行性
    severity: blocker
    check: 声称为平行光的光束，各光线之间必须严格保持平行，不得呈扇形发散或在到达透镜前就相互会聚
    on_fail: 转 code_render 节点（光路由薄透镜公式逐帧计算）
  - id: OPT-02
    applies_when: [光束, 光路, 光线, 激光, 平行光, 透镜, 会聚, 反射, 折射, 条纹, beam, ray, laser, lens, optical path, reflection, refraction, fringe]
    name: 折射只在界面发生
    severity: blocker
    check: 光线方向的改变只能发生在镜片、棱镜等介质界面处，在空气等均匀介质中必须沿直线传播
    on_fail: 转 code_render 节点
  - id: OPT-03
    applies_when: [光束, 光路, 光线, 激光, 平行光, 透镜, 会聚, 反射, 折射, 条纹, beam, ray, laser, lens, optical path, reflection, refraction, fringe]
    name: 焦点位置正确
    severity: blocker
    check: 平行光经会聚透镜后的焦点必须位于最后一片镜片之后的光轴上（像方），绝不能出现在镜筒或镜片组内部
    on_fail: 转 code_render 节点
  - id: OPT-04
    applies_when: [光束, 光路, 光线, 激光, 平行光, 透镜, 会聚, 反射, 折射, 条纹, beam, ray, laser, lens, optical path, reflection, refraction, fringe]
    name: 汇聚点唯一
    severity: blocker
    check: 同一束平行光经同一透镜只能汇聚出一个焦点，不得出现多个亮斑或分叉光路
  - id: OPT-05
    applies_when: [光束, 光路, 光线, 激光, 平行光, 透镜, 会聚, 反射, 折射, 条纹, beam, ray, laser, lens, optical path, reflection, refraction, fringe]
    name: 反射角关系
    severity: blocker
    check: 出现镜面反射时，反射光线与入射光线应关于法线对称（入射角等于反射角），不得随意弹射
  - id: OPT-06
    name: 光源与阴影一致
    severity: warning
    check: 画面中物体的阴影方向应与光源位置一致，多光源场景阴影关系应合理
  - id: OPT-10
    applies_when: [光束, 光路, 光线, 激光, 平行光, 透镜, 会聚, 反射, 折射, 条纹, beam, ray, laser, lens, optical path, reflection, refraction, fringe]
    name: 光路可见性
    severity: info
    check: 空气中可见光路属于教学示意的约定俗成可视化，不算错误，仅备注

# ── 保真对照规则（参考视频复刻模式专用，≤5条）──
ref_rules:
  - id: REFO-01
    name: 光路几何保真
    severity: blocker
    check: 与参考基准帧对照——光束的方向、入射/反射/折射的角度关系、光路折转位置必须一致，
      不得改变光传播路径
  - id: REFO-02
    name: 器件排布顺序保真
    severity: blocker
    check: 光学元件在光路上的排布顺序（如 光源→准直镜→样品→物镜→探测器）必须与参考一致，
      不得增删或调换器件位置
  - id: REFO-03
    name: 光斑与条纹形态保真
    severity: blocker
    check: 光斑的位置/形状/相对大小、干涉衍射条纹的结构与数量级、成像画面的内容
      必须与参考对应时刻一致，不得变成另一种图样
  - id: REFO-04
    name: 调节方向与现象对应
    severity: blocker
    check: 参考中"调节动作→现象变化"的对应关系（如 旋钮顺时针→光斑聚焦）在复刻中方向不得相反
  - id: REFO-05
    name: 偏振与滤光要素保真
    severity: warning
    check: 偏振片/滤光片的方位角标记、颜色滤光效果应与参考一致

# ── 复刻卡提取指引（分析参考视频时按此清单抓科学事实）──
ref_extract_focus:
  - 光学元件清单与在光路上的排布顺序
  - 光束路径与关键角度关系（入射/反射/折射/汇聚位置）
  - 一切可读数值：标尺/游标/表盘/屏显读数（看不清就写"读数不可辨"）
  - 光斑/条纹/成像画面的形态与位置
  - 每个调节动作与其引起的现象变化的对应关系
