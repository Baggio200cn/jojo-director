# 机械领域质检规则包（工业设备/传动类课程）
rules:
  - id: MEC-01
    name: 齿轮啮合转向
    severity: blocker
    check: 相互啮合的两个外齿轮转向必须相反；内啮合齿轮转向相同；不得出现啮合齿轮同向旋转（外啮合）的画面
    on_fail: 转 code_render 节点（传动关系程序化动画）
  - id: MEC-02
    name: 传动比与转速
    severity: blocker
    check: 大齿轮/大带轮转速应明显慢于与其配对的小齿轮/小带轮，不得出现大小轮转速相同或倒挂
  - id: MEC-03
    name: 皮带与链条方向
    severity: blocker
    check: 同一根皮带/链条连接的两轮转向必须相同（非交叉传动），皮带走向与轮转向必须自洽
  - id: MEC-04
    name: 受力与运动方向
    severity: blocker
    check: 画面中标注的力箭头、运动方向应与实际运动趋势一致，不得矛盾
  - id: MEC-05
    name: 机构连接完整
    severity: blocker
    check: 传动链各环节必须实际接触/连接，不得出现悬空传动、齿轮不接触却联动的画面
  - id: MEC-06
    name: 刚体不变形
    severity: warning
    check: 金属零件在正常演示中不应出现果冻般的扭曲变形（生成模型常见瑕疵）

# ── 保真对照规则（参考视频复刻模式专用，≤5条）──
ref_rules:
  - id: REFM-01
    name: 装夹与基准保真
    severity: blocker
    check: 与参考基准帧对照——工件的装夹方式、夹具类型、基准面/定位面的选择必须一致
  - id: REFM-02
    name: 刀具工件相对运动保真
    severity: blocker
    check: 刀具与工件的相对运动方向（进给方向/旋转方向，如顺铣与逆铣之别）必须与参考一致，
      方向相反即为错误示范
  - id: REFM-03
    name: 工序顺序保真
    severity: blocker
    check: 加工/装配工序的先后顺序必须与参考一致，不得颠倒（如先钻孔后攻丝、先粗后精）
  - id: REFM-04
    name: 安全要素保真
    severity: blocker
    check: 参考中存在的安全要素（防护罩闭合、急停按钮、操作者手位远离危险区、护目镜）
      在复刻中不得缺失或变为危险动作——安全错误示范是教学事故
  - id: REFM-05
    name: 配合与旋向保真
    severity: warning
    check: 轴孔配合关系、螺纹旋向（顺/逆时针拧紧方向）、联接件类型应与参考一致

# ── 复刻卡提取指引 ──
ref_extract_focus:
  - 工件装夹方式与所用夹具、基准面
  - 刀具/工具类型及其与工件的相对运动方向
  - 工序的先后顺序与每步的起止状态
  - 画面中的安全要素（防护装置状态、手位、护具）
  - 可读的量具读数与图纸标注（看不清就写"不可辨"）
