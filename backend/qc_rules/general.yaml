# 通用质检规则包（所有学科共用）
# severity: blocker=硬红线(不合格) / warning=软提醒 / info=备注不扣分
# 规则是给"视觉裁判"的审题标准，用自然语言描述，老师可直接增改
rules:
  - id: GEN-01
    name: 画面与分镜一致
    severity: blocker
    check: 画面内容必须与分镜描述的场景、对象、动作一致，不得出现无关物体或场景漂移
  - id: GEN-02
    name: 中文文字零错字
    severity: blocker
    check: 画面中出现的所有中文文字必须正确无错字、无乱码、无伪汉字
  - id: GEN-03
    name: 结构无穿帮
    severity: blocker
    check: 物体结构必须完整合理，不得出现断裂悬空、穿模、多余肢体、扭曲变形等生成瑕疵
  - id: GEN-04
    name: 无真实人脸
    severity: blocker
    check: 不得出现照片级真实人脸（平台审核红线），示意人物应为剪影、图标或卡通风格。本条只审"人脸"：手部、手指等无面孔的肢体特写属于教学操作画面的正常内容，不算违规
  - id: GEN-05
    name: 无多余文字水印
    severity: warning
    check: 除设计要求外，画面不应有多余的水印、logo、乱入文字
  - id: GEN-06
    name: 画质与曝光
    severity: warning
    check: 画面清晰、曝光正常，无严重噪点、模糊、过曝欠曝
  - id: GEN-07
    name: 场景常识完整性
    severity: blocker
    check: 画面必须符合所描绘场景的现实常识——该场景中理应存在的其他主体不得缺失
      （如：进行中的球赛应有双方多名球员和裁判，课堂应有学生，车间应有设备与操作环境）；
      大型物体的空间位置须合理（如吊挂物悬于正常高度、不遮挡主体活动区域）

# ── 保真对照规则（仅当质检带参考基准帧时启用）──
# 取舍原则：只收"错了会教错知识"且"看图能判"的项；判卷注意力有限，通用层≤4条
ref_rules:
  - id: REF-01
    name: 科学事实保真
    severity: blocker
    check: 与参考基准帧对照——仪表读数、器件状态、实验现象等客观事实必须一致，
      不得增删、改变或模糊化处理；美术风格允许不同
  - id: REF-02
    name: 动作与顺序一致
    severity: blocker
    check: 主体的动作姿态、操作顺序、发展阶段应与参考基准帧对应时刻一致，不得颠倒或跳步
  - id: REF-03
    name: 空间关系一致
    severity: blocker
    check: 主体间的相对位置、朝向、连接关系应与参考基准帧一致，不得镜像翻转或换位
  - id: REF-04
    name: 量值与刻度保真
    severity: blocker
    check: 参考中可读的数字、刻度、单位（读数/标尺/表盘/屏显数值）在复刻中必须保持同值同位；
      复刻中看不清时应留白，不得编造一个不同的数值
