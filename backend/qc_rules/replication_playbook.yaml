# 参考素材复刻打法库（Replication Playbook）
# ─────────────────────────────────────────────
# 定位：每种参考素材类型的默认策略、创新动作、权利红线。
# 这是"讨论产出制度化"的落盘处——每次与 AI/团队讨论出新打法，追加词条即可，
# 系统读本文件生成素材体检报告与策略建议，老师可直接编辑。
# 路线定义：R1=真实素材增强(零幻觉) R2=真实帧锚定 R3=风格化重演 R4=内容重演绎

kinds:
  talking_head:
    label: 教师口播 / 讲授视频
    detect: 人物为画面主体、场景几乎不切换、语音信息密度高
    default_route: R4
    rationale: 口播的核心资产是讲解内容而非画面；人像画面复用价值低且涉肖像权
    moves:                       # 创新动作清单（重演绎时逐条考虑）
      - 听觉变视觉：口头描述的现象/原理转为可视化镜头（严谨图表走代码渲染）
      - 节奏重构：去口头语与重复，3分钟口播通常可压至60-120秒
      - 结构增强：加知识卡/小结卡/同步字幕
      - 板书或教具特写段可单独走 R1 增强保留
    rights:
      - 第三方素材：只学内容结构，必须重写讲稿表述，禁用原声原像
      - 本人素材（作者授权自己）：可保留原声重做画面——老师从此不必出镜
  demo_experiment:
    label: 实验演示 / 实训操作
    detect: 以仪器/器件/操作为主体，画面即知识
    default_route: R1
    rationale: 科学真实性最高优先级——真实画面就是最好的教学画面，增强而非重造
    moves:
      - 慢放关键操作、区域特写放大
      - 标注框+文字指出观察点
      - 画中画：真实现象与理想化代码渲染并排对照
      - 需要理想化视角（如内部结构）的段落补 R3/代码渲染镜头
    rights:
      - 出现操作者人脸的段落：裁剪构图避开或仅用无人脸段
  production_line:
    label: 产线实拍 / 工业场景
    detect: 设备连续运转、多机位或固定监控视角
    default_route: R2
    rationale: 真实帧锚定保场景可信，AI 补运动镜头提升观感
    moves:
      - 关键状态帧锚定 + 视频模型补中间过程
      - 检测判定结果（OK/NG、读数）绝对保真（REFV-03）
    rights:
      - 厂区可识别信息（厂名/工牌/人脸）需规避或打码后再用
  animation_2d:
    label: 已有动画 / 图解视频
    detect: 扁平图形、示意图风格、无实拍
    default_route: R3
    rationale: 动画本身就是演绎，可按项目风格锚整体重绘并优化叙事
    moves:
      - 提取其知识结构与镜头节奏，按本项目风格锚重绘
      - 原动画中的错误或过时内容顺手修正（记入断言）
    rights:
      - 他人动画的美术设计受版权保护——学结构不抄画面
  mixed:
    label: 混合型（口播+演示穿插）
    detect: 口播段与演示段交替
    default_route: 分段路由
    rationale: 逐段定性，各段走各自最优路线（口播段R4、演示段R1）
    moves:
      - 切分后按段定性，口播段并入讲稿、演示段进画面产线
