# 机器视觉领域质检规则包（工业检测/视觉系统课程）
rules:
  - id: MV-01
    name: 打光与成像对应
    severity: blocker
    check: 光源类型与打光角度（环形/背光/同轴/低角度）应与其成像效果自洽——
      背光应出轮廓剪影、低角度应显表面划痕，不得出现与打光方式矛盾的画面效果
  - id: MV-02
    name: 图像处理前后对应
    severity: blocker
    check: 展示图像处理效果时（灰度化/二值化/边缘提取/滤波），处理后图像必须与原图同一场景
      同一构图，处理效果的方向必须正确（如二值化只有黑白两级）
  - id: MV-03
    name: 缺陷位置一致
    severity: blocker
    check: 检测演示中被标出的缺陷/目标位置，在原图、处理图、结果标注图之间必须位置一致，不得漂移
  - id: MV-04
    name: 标定与坐标要素
    severity: blocker
    check: 标定板格点应为规则阵列（棋盘格行列整齐），坐标系箭头与标注应符合右手系惯例，
      ROI 框应完整框住目标
  - id: MV-05
    name: 相机与视场自洽
    severity: warning
    check: 相机指向、工作距离与所示视场画面应几何自洽，镜头对着的方向与"拍到的画面"不得矛盾

# ── 保真对照规则（参考视频复刻模式专用）──
ref_rules:
  - id: REFV-01
    name: 视觉系统布局保真
    severity: blocker
    check: 与参考基准帧对照——相机、光源、工件三者的相对位置与朝向必须一致（打光几何决定成像，不可改变）
  - id: REFV-02
    name: 处理链路保真
    severity: blocker
    check: 图像处理流程的步骤顺序与每步效果必须与参考一致（如 原图→灰度→二值→形态学→轮廓），不得增删步骤
  - id: REFV-03
    name: 检测结果保真
    severity: blocker
    check: 检测结果（OK/NG 判定、缺陷位置与数量、测量数值）必须与参考一致，不得改变判定结论
  - id: REFV-04
    name: 界面与参数保真
    severity: warning
    check: 软件界面中的关键参数值（阈值/曝光/增益）如在参考中可读，复刻应保持同值；不可辨时留白

# ── 复刻卡提取指引 ──
ref_extract_focus:
  - 相机/光源/工件的相对位置与打光方式
  - 图像处理流程的步骤顺序及每步前后画面变化
  - 检测判定结果（OK/NG、缺陷位置数量、测量值）
  - 软件界面上可读的关键参数与数值
  - 操作动作与画面响应的对应关系
